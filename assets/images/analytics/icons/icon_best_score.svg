<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#FFE66D" opacity="0.15"/>
  <circle cx="128" cy="128" r="115" fill="none" stroke="#FFE66D" stroke-width="3"/>

  <!-- Trophy -->
  <g transform="translate(70, 50)">
    <!-- Cup -->
    <ellipse cx="60" cy="40" rx="35" ry="25" fill="#FFE66D" stroke="#FFC107" stroke-width="2"/>
    <path d="M 25 65 L 20 90 L 100 90 L 95 65" fill="#FFE66D" stroke="#FFC107" stroke-width="2"/>

    <!-- Handles -->
    <path d="M 25 55 Q 10 60 15 80" fill="none" stroke="#FFE66D" stroke-width="6"/>
    <path d="M 95 55 Q 110 60 105 80" fill="none" stroke="#FFE66D" stroke-width="6"/>

    <!-- Base -->
    <rect x="45" y="90" width="30" height="20" fill="#FFE66D" stroke="#FFC107" stroke-width="2"/>
  </g>

  <!-- Stars -->
  <g transform="translate(140, 80)">
    <!-- Star 1 -->
    <polygon points="20,5 25,20 40,20 28,30 35,45 20,35 5,45 12,30 0,20 15,20" fill="#FFC107"/>
    <!-- Star 2 -->
    <polygon points="65,25 68,35 80,35 70,42 73,52 65,45 57,52 60,42 50,35 62,35" fill="#FFC107"/>
  </g>
</svg>
