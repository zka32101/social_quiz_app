<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Main background -->
  <rect width="1200" height="800" fill="#F8F9FA"/>

  <!-- Subtle gradient -->
  <defs>
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:0.03" />
    </linearGradient>
    <pattern id="stageDots" x="40" y="40" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#2ECC71" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#stageBg)"/>
  <rect width="1200" height="800" fill="url(#stageDots)"/>

  <!-- Left side: Simplified Japan map grid -->
  <g opacity="0.15" transform="translate(100, 150)">
    <!-- Hokkaido -->
    <rect x="150" y="0" width="80" height="60" fill="none" stroke="#27AE60" stroke-width="2" rx="3"/>
    <!-- Honshu main islands -->
    <rect x="80" y="80" width="200" height="150" fill="none" stroke="#2ECC71" stroke-width="2" rx="3"/>
    <!-- Shikoku -->
    <rect x="100" y="240" width="80" height="50" fill="none" stroke="#27AE60" stroke-width="2" rx="3"/>
    <!-- Kyushu -->
    <rect x="50" y="280" width="70" height="100" fill="none" stroke="#2ECC71" stroke-width="2" rx="3"/>
  </g>

  <!-- Right side: Bar charts -->
  <g opacity="0.25" transform="translate(550, 150)">
    <text x="0" y="-20" font-size="18" font-weight="bold" fill="#27AE60">正答率</text>
    <rect x="0" y="0" width="30" height="150" fill="#2ECC71" rx="3"/>
    <rect x="50" y="50" width="30" height="100" fill="#27AE60" rx="3"/>
    <rect x="100" y="30" width="30" height="120" fill="#2ECC71" rx="3"/>
    <rect x="150" y="80" width="30" height="70" fill="#4ECDC4" rx="3"/>
  </g>

  <!-- Bottom decorative elements -->
  <g opacity="0.08">
    <circle cx="200" cy="700" r="80" fill="#2ECC71"/>
    <circle cx="1000" cy="750" r="60" fill="#27AE60"/>
    <circle cx="600" cy="650" r="40" fill="#4ECDC4"/>
  </g>

  <!-- Top right accent -->
  <g opacity="0.12">
    <polygon points="1050,50 1100,30 1120,80 1080,100" fill="#FFE66D"/>
    <polygon points="1150,100 1200,80 1190,140 1140,150" fill="#FF6B6B"/>
  </g>
</svg>
