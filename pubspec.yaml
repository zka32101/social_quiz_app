name: social_quiz_app
description: "小学コレ！社会 — 小4・5年生が都道府県を楽しく学べる学習ゲームアプリ"
publish_to: 'none'
version: 1.1.0+8

# Build trigger for shared_core APK integration - 2026-09-13 10:29
environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0

  # 小学コレ共通パッケージ
  shared_core:
    git:
      url: https://github.com/zka32101/shared_core.git
      ref: main
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit.git
      ref: v0.2.0

  # 状態管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ローカルDB（オフライン対応）
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_remote_config: ^6.7.0
  firebase_messaging: ^16.7.0 # Phase 4.18: Firebase Cloud Messaging (push notifications)

  # ナビゲーション
  go_router: ^17.5.0

  # 地図（OpenStreetMap）
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # 課金
  purchases_flutter: ^10.11.0

  # ネットワーク状態
  connectivity_plus: ^7.3.1

  # 音声読み上げ
  flutter_tts: ^4.2.0

  # 共有
  share_plus: ^13.3.0

  # ユーティリティ
  uuid: ^4.4.0
  intl: ^0.20.3

  # ショップアイテム（テーマ・フレーム）のSVG表示。shared_core の CoinShopPage/
  # ホーム画面のフレーム表示で使用。バージョンは shared_core に合わせる
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons_common/
    - assets/badges/
    - assets/shop/
    - assets/shop/thumb/
    # 2026-09: Flutter のディレクトリ指定アセットはサブフォルダを自動では
    # 再帰的に含めないため（assets/images/ 直下にファイルが無く、実体は
    # すべて 2階層以上下のサブフォルダにあり、これまで一切バンドルされて
    # いなかった）、実際にファイルが存在する葉フォルダを個別に列挙する。
    - assets/images/ranking/
    - assets/images/analytics/
    - assets/images/analytics/backgrounds/
    - assets/images/analytics/decorations/
    - assets/images/analytics/headers/
    - assets/images/analytics/icons/
    - assets/images/learn/civics/
    - assets/images/learn/environment/
    - assets/images/learn/grade3/
    - assets/images/learn/grade4/
    - assets/images/learn/industry/
    - assets/data/
    - assets/logos/
    - assets/icon/
    - assets/characters/
    - assets/history/
    - assets/avatars/
    - assets/branding/
    - assets/celebrate/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon_shakai.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/adaptive_bg_shakai.png"
  adaptive_icon_foreground: "assets/icon/adaptive_fg_shakai.png"
  web:
    generate: false
