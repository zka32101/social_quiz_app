name: social_quiz_app
description: "小学コレ！社会 — 小4・5年生が都道府県を楽しく学べる学習ゲームアプリ"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 小学コレ共通パッケージ
  shared_core:
    git:
      url: https://github.com/org-zka32101/shared_core.git
      ref: main

  # 状態管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ローカルDB（オフライン対応）
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.0
  firebase_remote_config: ^5.0.0

  # ナビゲーション
  go_router: ^17.5.0

  # 地図（OpenStreetMap）
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # 課金
  purchases_flutter: ^8.0.0

  # 広告
  google_mobile_ads: ^5.1.0

  # ネットワーク状態
  connectivity_plus: ^6.0.3

  # 音声読み上げ
  flutter_tts: ^4.2.0

  # 共有
  share_plus: ^10.0.0

  # ユーティリティ
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/icon/
    - assets/characters/
    - assets/history/
    - assets/avatars/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
  web:
    generate: false
